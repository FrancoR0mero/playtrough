<div class="flex min-h-screen flex-col">
  <header
    class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 bg-background px-4 py-4 sm:px-6"
  >
    <a
      routerLink="/"
      (click)="closeMenu()"
      class="rounded font-serif text-2xl font-semibold tracking-tight text-white focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-accent"
      >Playtrough<span aria-hidden="true" class="text-indigo-400">.</span></a
    >
    <button
      #menuToggle
      type="button"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen()"
      (click)="menuOpen.set(!menuOpen())"
      class="min-h-11 rounded-md border border-slate-600 px-4 py-2 text-sm text-white hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-accent md:hidden"
    >
      {{ menuOpen() ? 'Cerrar menú' : 'Abrir menú' }}
    </button>
    <nav
      id="primary-navigation"
      aria-label="Navegación principal"
      [class.hidden]="!menuOpen()"
      [class.flex]="menuOpen()"
      class="w-full flex-col gap-4 border-t border-slate-800 pt-4 md:flex md:w-auto md:flex-row md:items-center md:border-0 md:pt-0"
    >
      @if (auth.isAuthenticated()) {
        <ul class="flex flex-col gap-1 md:flex-row md:gap-4">
          @for (item of navigationItems; track item.path) {
            @if (item.enabled) {
              <li *appHasRole="item.minRole">
                <a
                  [routerLink]="item.path"
                  routerLinkActive="text-white"
                  ariaCurrentWhenActive="page"
                  (click)="closeMenu()"
                  class="flex min-h-11 items-center rounded px-2 py-2 text-sm text-slate-300 hover:text-white focus-visible:outline-2 focus-visible:outline-accent"
                  >{{ item.label }}</a
                >
              </li>
            }
          }
        </ul>
        <div
          class="flex flex-wrap items-center gap-3 border-t border-slate-800 pt-4 md:border-t-0 md:border-l md:pl-5 md:pt-0"
        >
          @if (auth.currentUser(); as user) {
            <span class="min-w-0 break-all text-sm font-medium text-white">{{
              user.username
            }}</span>
            <span
              class="rounded border border-slate-700 px-2 py-1 text-xs text-slate-300"
              aria-label="Rol de la cuenta"
              >{{ user.role }}</span
            >
          }
          <button
            data-action="logout"
            type="button"
            (click)="logout()"
            [disabled]="loggingOut()"
            [attr.aria-busy]="loggingOut()"
            class="min-h-11 rounded-md border border-slate-600 px-4 py-2 text-sm text-white hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-accent disabled:cursor-wait disabled:opacity-60"
          >
            {{ loggingOut() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
          </button>
        </div>
      } @else {
        <a
          routerLink="/auth/login"
          (click)="closeMenu()"
          class="flex min-h-11 items-center rounded px-3 py-2 text-sm text-slate-300 hover:text-white focus-visible:outline-2 focus-visible:outline-accent"
          >Iniciar sesión</a
        >
        <a
          routerLink="/auth/register"
          (click)="closeMenu()"
          class="inline-flex min-h-11 items-center justify-center rounded-md border border-slate-600 px-4 py-2 text-sm text-white hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-accent"
          >Registrarse</a
        >
      }
    </nav>
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-800 px-6 py-4">
    <span class="mr-2 rounded bg-playing px-2 py-1 text-xs text-background">Playing</span>
    <span class="mr-2 rounded bg-backlog px-2 py-1 text-xs text-background">Backlog</span>
    <span class="mr-2 rounded bg-finished px-2 py-1 text-xs text-background">Finished</span>
    <span class="rounded bg-platinum px-2 py-1 text-xs text-background">Platinum</span>
  </footer>
</div>
