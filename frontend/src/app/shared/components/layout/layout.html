<div class="flex min-h-screen flex-col">
  <header
    class="flex flex-wrap items-center justify-between gap-4 bg-background px-4 py-4 text-accent sm:px-6"
  >
    <span class="text-lg font-semibold">Playtrough</span>
    @if (auth.isAuthenticated()) {
      <button
        type="button"
        (click)="logout()"
        [disabled]="loggingOut()"
        [attr.aria-busy]="loggingOut()"
        class="rounded-md border border-slate-600 px-4 py-2 text-sm text-white hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-accent disabled:cursor-wait disabled:opacity-60"
      >
        {{ loggingOut() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
      </button>
    }
  </header>

  <main class="flex-1">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-800 px-6 py-4">
    <span class="mr-2 rounded bg-playing px-2 py-1 text-xs text-background">Playing</span>
    <span class="mr-2 rounded bg-backlog px-2 py-1 text-xs text-background">Backlog</span>
    <span class="mr-2 rounded bg-finished px-2 py-1 text-xs text-background">Finished</span>
    <span class="rounded bg-platinum px-2 py-1 text-xs text-background">Platinum</span>
  </footer>
</div>
