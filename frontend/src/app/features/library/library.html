<section class="mx-auto max-w-4xl px-4 py-10 sm:px-6">
  @if (auth.currentUser(); as user) {
    <h1 class="text-3xl font-semibold text-white">Tu biblioteca</h1>
    <p class="mt-4 text-slate-300">
      Bienvenido, {{ user.username }}. Este es tu espacio para organizar tus juegos.
    </p>
    <button
      type="button"
      (click)="logout()"
      class="mt-8 rounded-md border border-slate-600 px-4 py-2 text-white hover:bg-slate-800 focus-visible:outline-2 focus-visible:outline-accent"
    >
      Cerrar sesión
    </button>
  } @else {
    <p role="alert" class="text-slate-200">Tu sesión venció. Volvé a iniciar sesión.</p>
    <a
      routerLink="/auth/login"
      class="mt-4 inline-block rounded text-indigo-300 underline focus-visible:outline-2 focus-visible:outline-accent"
      >Iniciar sesión</a
    >
  }
</section>
