<app-confirmation-content
  eyebrow="ADMINISTRACIÓN DE ROLES"
  title="Confirmar cambio de rol"
  titleId="role-change-title"
  descriptionId="role-change-description"
  note="El usuario deberá volver a iniciar sesión para renovar su acceso."
  confirmLabel="Confirmar cambio"
  (cancelled)="dialog.close(false)"
  (confirmed)="dialog.close(true)"
>
  ¿Cambiar el rol de <strong class="text-white">{{ change.user.username }}</strong> de
  {{ change.user.role }} a {{ change.role }}?
</app-confirmation-content>
