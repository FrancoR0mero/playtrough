<div class="grid gap-4">
  @for (section of sections(); track section.id) {
    <fieldset class="min-w-0">
      <legend class="mb-1 text-sm font-medium text-slate-300">{{ section.name }}</legend>
      <div class="flex flex-wrap gap-x-4 gap-y-1">
        @for (tag of section.tags; track tag.id) {
          <label class="inline-flex min-h-11 cursor-pointer items-center gap-2 text-sm text-white">
            <input
              #option
              type="checkbox"
              name="tagIds"
              [value]="tag.id"
              [checked]="selected().includes(tag.id)"
              (change)="toggle(tag.id, option.checked)"
              class="size-4 shrink-0 accent-accent"
            />
            {{ tag.name }}
          </label>
        }
      </div>
    </fieldset>
  }
</div>
