<section class="mx-4 my-8 max-w-md rounded-lg border border-slate-700 bg-slate-900/60 p-5 sm:mx-auto sm:my-16 sm:p-8">
  <h1 class="mb-3 text-2xl font-semibold text-white">Recuperar contraseña</h1>
  <p class="mb-6 text-sm text-slate-300">Ingresá tu email para recibir un enlace de restablecimiento.</p>
  @if (sent()) {
    <p role="status" class="mb-5 rounded-md border border-emerald-600 bg-emerald-950/40 p-4 text-emerald-100">Si el email está registrado, te enviamos un link para restablecer tu contraseña.</p>
  }
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="space-y-5" [attr.aria-busy]="submitting()">
    <div>
      <label for="recovery-email" class="mb-1 block text-sm text-slate-200">Email</label>
      <input id="recovery-email" type="email" formControlName="email" autocomplete="email" required [readOnly]="submitting() || remaining() > 0" [attr.aria-invalid]="emailError() ? 'true' : null" [attr.aria-describedby]="emailError() ? 'email-error' : null" class="w-full rounded-md border border-slate-600 bg-transparent px-3 py-2 text-white focus:outline-accent" />
      @if (emailError(); as message) { <p id="email-error" role="alert" class="mt-1 text-sm text-red-400">{{ message }}</p> }
    </div>
    <button type="submit" [disabled]="form.invalid || submitting() || remaining() > 0" class="flex w-full items-center justify-center gap-2 rounded-md bg-accent px-4 py-2 font-semibold text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-not-allowed disabled:opacity-50">
      @if (submitting()) { <span aria-hidden="true" class="h-4 w-4 animate-spin rounded-full border-2 border-white/30 border-t-white motion-reduce:animate-none"></span> }
      {{ submitting() ? 'Enviando…' : remaining() > 0 ? 'Reenviar en ' + remaining() + ' s' : sent() ? 'Reenviar enlace' : 'Enviar enlace' }}
    </button>
  </form>
  @if (error(); as message) { <p role="alert" class="mt-5 rounded-md border border-red-500/60 bg-red-950/40 p-4 text-red-200">{{ message }}</p> }
  <a routerLink="/auth/login" class="mt-6 inline-block rounded text-indigo-300 underline focus-visible:outline-2 focus-visible:outline-accent">Volver al login</a>
</section>
